<section class="auth-page">

  <div class="auth-card">

    <div class="auth-header">

      <div class="auth-icon">
        <i class="bi bi-key"></i>
      </div>

      <h1>
        نسيت كلمة المرور؟
      </h1>

      <p>
        اكتب البريد الإلكتروني وكلمة المرور الجديدة.
      </p>

    </div>


    @if (errorMessage) {

      <div class="alert-message error">

        <i class="bi bi-exclamation-circle"></i>

        {{ errorMessage }}

      </div>

    }


    @if (successMessage) {

      <div class="alert-message success">

        <i class="bi bi-check-circle"></i>

        {{ successMessage }}

      </div>

    }


    <form
      [formGroup]="resetForm"
      (ngSubmit)="resetPassword()"
    >

      <div class="form-group">

        <label for="email">
          البريد الإلكتروني
        </label>

        <div class="input-wrapper">

          <i class="bi bi-envelope"></i>

          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="example@gmail.com"
          >

        </div>

      </div>


      <div class="form-group">

        <label for="newPassword">
          كلمة المرور الجديدة
        </label>

        <div class="input-wrapper">

          <i class="bi bi-lock"></i>

          <input
            id="newPassword"
            [type]="
              showPassword
                ? 'text'
                : 'password'
            "
            formControlName="newPassword"
            placeholder="6 أحرف على الأقل"
          >

          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
          >

            <i
              class="bi"
              [class.bi-eye]="!showPassword"
              [class.bi-eye-slash]="showPassword"
            ></i>

          </button>

        </div>

      </div>


      <button
        type="submit"
        class="submit-btn"
      >

        <i class="bi bi-key"></i>

        تغيير كلمة المرور

      </button>

    </form>


    <div class="auth-footer">

      تذكرت كلمة المرور؟

      <a routerLink="/login">
        تسجيل الدخول
      </a>

    </div>

  </div>

</section>
