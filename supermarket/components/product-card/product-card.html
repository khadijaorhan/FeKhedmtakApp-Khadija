<div class="product-card" [routerLink]="['/supermarket/product', product?.id]">
  <div class="image-wrapper">
    <img [src]="product?.image" [alt]="product?.name" loading="lazy" />
    <span class="badge discount" *ngIf="product?.oldPrice && product?.oldPrice > product?.price">
      خصم {{ ((product.oldPrice - product.price) / product.oldPrice * 100) | number:'1.0-0' }}%
    </span>
    <span class="badge stock-out" *ngIf="!product?.inStock">غير متوفر</span>
  </div>

  <div class="card-body">
    <span class="category-tag">{{ product?.category }}</span>
    <h3 class="product-title">{{ product?.name }}</h3>
    <p class="product-desc">{{ product?.description }}</p>

    <div class="rating" *ngIf="product?.rating">
      <span class="star">★</span>
      <span class="rating-value">{{ product?.rating }}</span>
    </div>

    <div class="card-footer">
      <div class="price-container">
        <span class="current-price">{{ product?.price }} ج.م</span>
        <span class="old-price" *ngIf="product?.oldPrice">{{ product?.oldPrice }} ج.م</span>
      </div>

      <button
        class="btn-add"
        (click)="onAddToCart($event)"
        [disabled]="!product?.inStock">
        + أضف للسلة
      </button>
    </div>
  </div>
</div>
