<!-- خلفية معتمة تغلق السلة عند الضغط عليها -->
<div class="drawer-backdrop" *ngIf="isOpen" (click)="onClose()"></div>

<!-- الدرج الجانبي للسلة -->
<aside class="cart-drawer" [class.open]="isOpen" dir="rtl">
  <!-- رأس السلة -->
  <div class="drawer-header">
    <div class="header-title">
      <h3>سلة المشتريات</h3>
      <span class="count-badge" *ngIf="(totalCount$ | async) as count">({{ count }})</span>
    </div>
    <button class="btn-close" (click)="onClose()" title="إغلاق السلة">✕</button>
  </div>

  <!-- محتوى السلة -->
  <div class="drawer-body">
    <!-- في حالة السلة فارغة -->
    <div class="empty-cart" *ngIf="((cartItems$ | async)?.length ?? 0) === 0">
      <div class="empty-icon">🛒</div>
      <h4>سلتك فارغة حالياً</h4>
      <p>تصفح المنتجات وأضف ما تحتاجه لتجربة تسوق مميزة</p>
    </div>

    <!-- قائمة المنتجات المضافة -->
    <div class="cart-items-list" *ngIf="((cartItems$ | async)?.length ?? 0) > 0">
      <div class="cart-item" *ngFor="let item of (cartItems$ | async)">
        <img [src]="item.image" [alt]="item.name" class="item-img" />

        <div class="item-details">
          <h4 class="item-name">{{ item.name }}</h4>
          <span class="item-price">{{ item.price }} ج.م</span>

          <div class="item-actions">
            <!-- أزرار التحكم بالكمية -->
            <div class="quantity-control">
              <button (click)="decreaseQuantity(item.id)">-</button>
              <span>{{ item.quantity }}</span>
              <button (click)="increaseQuantity(item.id)">+</button>
            </div>

            <!-- زر الحذف -->
            <button class="btn-remove" (click)="removeItem(item.id)" title="حذف المنتج">
              🗑️
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- أسفل السلة: ملخص الحساب وزر الشراء -->
  <div class="drawer-footer" *ngIf="((cartItems$ | async)?.length ?? 0) > 0">
    <div class="summary-row">
      <span>المجموع الفرعي:</span>
      <span>{{ (totalPrice$ | async) }} ج.م</span>
    </div>

    <div class="summary-row">
      <span>مصاريف الشحن:</span>
      <span>15 ج.م</span>
    </div>

    <div class="summary-row total">
      <span>الإجمالي النهائي:</span>
      <span>{{ ((totalPrice$ | async) ?? 0) + 15 }} ج.م</span>
    </div>

    <!-- زر إتمام الطلب -->
    <button class="btn-checkout" (click)="goToCheckout()">
      إتمام الطلب الآن
    </button>

    <!-- زر تفريغ السلة -->
    <button class="btn-clear" (click)="clearCart()">
      تفريغ السلة
    </button>
  </div>
</aside>
